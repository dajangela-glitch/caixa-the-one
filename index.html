<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src data: 'self'; manifest-src 'self'; connect-src 'self' https://*.supabase.co">
<meta name="theme-color" content="#33302B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Caixa The One">
<title>Caixa The One</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Krona+One&display=swap">
<style>
:root{
  color-scheme:light;
  /* Base DAJ / The View */
  --papel:#F5F4EE; --folha:#FBFAF6; --calmo:#E4E2D6; --linha:#DDDACD; --quente:#766B60;
  --tinta:#33302B; --tinta2:#5C564E; --tinta3:#6E665D;
  /* Cores foscas por função */
  --entra:#4A8A7A; --entra-bg:#E3EEE9;
  --sai:#B0663F;   --sai-bg:#F4E6DB;
  --saldo:#44687A; --saldo-bg:#E0E9EC;
  --prev:#7E6A8F;  --prev-bg:#ECE7EF;
  /* Situação */
  --bom:#55704F;   --bom-bg:#E4ECDF;
  --alerta:#96702A;--alerta-bg:#F4EBD4;
  --critico:#9C4436;--critico-bg:#F5E1DB;
  --titulo:'Krona One','Michroma',Calibri,sans-serif;
  --texto:Calibri,'Source Sans 3','Segoe UI',Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--papel);color:var(--tinta);font:400 16px/1.45 var(--texto)}
h1,h2,h3{font-family:var(--titulo);font-weight:400;margin:0;letter-spacing:-.01em}
h2{font-size:15px;line-height:1.4}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--saldo);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* Topo */
.topo{background:var(--folha);border-bottom:1px solid var(--linha);position:sticky;top:0;z-index:20}
.topo-in{max-width:1280px;margin:auto;padding:10px 20px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.marca{font:400 17px var(--titulo);color:var(--tinta);white-space:nowrap}
.abas{display:flex;gap:4px;flex:1;min-width:300px}
.aba{border:0;background:none;padding:10px 14px;border-radius:9px;color:var(--tinta2);font-weight:600;min-height:42px;white-space:nowrap}
.aba:hover{background:var(--calmo)}
.aba.on{background:var(--tinta);color:#fff}
.sync{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--tinta2);line-height:1.2}
.ponto{width:10px;height:10px;border-radius:50%;flex:none}
.btn{border:1px solid var(--linha);background:var(--folha);border-radius:9px;padding:9px 15px;font-weight:600;min-height:42px}
.btn:hover{background:var(--calmo)}
.btn.forte{background:var(--tinta);border-color:var(--tinta);color:#fff}
.btn.forte:hover{background:#4A453E}
.btn.mini{min-height:32px;padding:4px 10px;font-size:14px}
.link{border:0;background:none;padding:0;color:var(--saldo);font-weight:600;text-decoration:underline;text-underline-offset:2px}
main{max-width:1280px;margin:auto;padding:20px}

/* Faixas de aviso */
.faixa{display:flex;gap:14px;align-items:center;padding:15px 18px;border-radius:13px;margin-bottom:14px;flex-wrap:wrap}
.faixa .ic{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700}
.faixa .tx{flex:1;min-width:260px}
.faixa b{font-weight:700}
.faixa small{display:block;color:var(--tinta2);font-size:14.5px}
.f-bom{background:var(--bom-bg)} .f-bom .ic{background:var(--bom)}
.f-alerta{background:var(--alerta-bg)} .f-alerta .ic{background:var(--alerta)}
.f-critico{background:var(--critico-bg)} .f-critico .ic{background:var(--critico)}
.f-grande .tx{font-size:20px;line-height:1.3}

/* Cartões */
.card{background:var(--folha);border:1px solid var(--linha);border-radius:14px;padding:18px}
.fluxo{display:grid;grid-template-columns:1fr auto 1fr auto 1fr auto 1fr;gap:8px;align-items:stretch;margin-bottom:14px}
.op{align-self:center;font-size:26px;color:var(--quente);font-weight:300;padding:0 2px}
.stat{padding:15px 17px;border-radius:14px;background:var(--folha);border:1px solid var(--linha);min-width:0;cursor:pointer;text-align:left;display:block;width:100%}
.stat:hover{border-color:var(--quente)}
.stat .rot{font-size:15px;color:var(--tinta2);display:flex;align-items:center;gap:7px}
.stat .val{font-size:29px;font-weight:700;line-height:1.2;margin-top:3px;white-space:nowrap}
.stat .sub{font-size:14px;color:var(--tinta3);min-height:20px}
.chip{width:11px;height:11px;border-radius:3px;display:inline-block;flex:none}
.stat.t-saldo{background:var(--saldo-bg);border-color:transparent}
.stat.t-entra{background:var(--entra-bg);border-color:transparent}
.stat.t-sai{background:var(--sai-bg);border-color:transparent}
.stat.t-fim{background:var(--tinta);border-color:transparent;color:#fff}
.stat.t-fim .rot,.stat.t-fim .sub{color:#D5D4C7}
.stat.t-fim.neg{background:var(--critico)}

.grade{display:grid;grid-template-columns:minmax(0,2.1fr) minmax(280px,1fr);gap:14px;margin-bottom:14px;align-items:start}
.pilha{display:grid;gap:14px}
.cab{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.cab p{margin:2px 0 0;color:var(--tinta3);font-size:14.5px}
.seg{display:inline-flex;background:var(--calmo);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;font-weight:600;color:var(--tinta2);min-height:34px;font-size:15px}
.seg button.on{background:var(--folha);color:var(--tinta);box-shadow:0 1px 2px rgba(51,48,43,.16)}
.cenario{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 14px}
.cenario .rt{font-weight:600}

.lista{list-style:none;margin:0;padding:0}
.lista li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--calmo);align-items:baseline}
.lista li:first-child{border-top:0}
.lista .d{color:var(--tinta2);font-size:15px}
.lista .v{font-weight:700;white-space:nowrap}
.linha-btn{all:unset;box-sizing:border-box;cursor:pointer;display:flex;justify-content:space-between;gap:12px;width:100%;align-items:baseline}
.linha-btn:hover .d{text-decoration:underline}
.linha-btn:focus-visible{outline:2px solid var(--saldo);outline-offset:2px}

.leg{display:flex;gap:16px;font-size:14.5px;color:var(--tinta2);flex-wrap:wrap}
.leg span{display:flex;align-items:center;gap:6px}

/* Tabela */
.tab-wrap{overflow:auto;border:1px solid var(--linha);border-radius:12px;background:var(--folha)}
table{border-collapse:collapse;width:100%;font-size:15px}
th{font-weight:600;text-align:right;color:var(--tinta2);background:#F0EEE6;padding:9px 11px;white-space:nowrap;position:sticky;top:0;z-index:1;font-size:14.5px}
td{padding:9px 11px;text-align:right;border-top:1px solid var(--calmo);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td.esq,th.esq{text-align:left;white-space:normal}
tbody tr.cl{cursor:pointer}
tbody tr.cl:hover{background:#F2F0E8}
tr.hoje td{background:var(--saldo-bg);font-weight:600}
tr.vazio td{color:#A29C90}
tr.fds td:first-child{color:var(--tinta3)}
td.vaz{color:#BDB8AC}
td.neg{color:var(--critico);font-weight:700}
.grupo{border-left:2px solid var(--calmo)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:99px;font-size:13.5px;font-weight:600;white-space:nowrap}
.p-bom{background:var(--bom-bg);color:#3F5A3A}.p-alerta{background:var(--alerta-bg);color:#6F5119}
.p-critico{background:var(--critico-bg);color:#7F3327}.p-neutro{background:var(--calmo);color:var(--tinta2)}
.p-prev{background:var(--prev-bg);color:#5C4B6C}.p-saldo{background:var(--saldo-bg);color:#2F4E5D}

.barra-mes{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.barra-mes h2{font-size:18px;min-width:215px;text-align:center}
.mini-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.mini-stats div{background:var(--folha);border:1px solid var(--linha);border-radius:12px;padding:11px 14px}
.mini-stats span{font-size:14.5px;color:var(--tinta2);display:flex;gap:6px;align-items:center}
.mini-stats b{font-size:20px;display:block;white-space:nowrap}
label.check{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-weight:600}
input[type=checkbox]{width:19px;height:19px;accent-color:var(--tinta)}

/* Calendário */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .sem{font-size:13.5px;color:var(--tinta3);text-align:center;padding:3px 0;font-weight:600}
.dia{border:0;border-radius:9px;min-height:68px;padding:6px 8px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;background:#EEEDE6;color:var(--tinta3)}
.dia .n{font-size:14px;font-weight:600}
.dia .f{font-size:13.5px;font-weight:600;white-space:nowrap}
.dia:hover{box-shadow:inset 0 0 0 2px var(--quente)}
.dia.passado{background:none;color:#B1AC9F;cursor:default;box-shadow:none}
.dia.hoje{box-shadow:inset 0 0 0 2px var(--tinta)}
.nv0{background:var(--critico-bg);color:#7F3327}
.nv1{background:#E0E9EC;color:#2F4E5D}.nv2{background:#BCD0D8;color:#2A4553}
.nv3{background:#8FAFBC;color:#1F3540}.nv4{background:#5F8496;color:#fff}.nv5{background:#44687A;color:#fff}
.escala{display:flex;gap:3px;align-items:center;font-size:14px;color:var(--tinta2);flex-wrap:wrap}
.escala i{width:26px;height:14px;border-radius:3px;display:block}

.semanas{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.sem-card{all:unset;box-sizing:border-box;cursor:pointer;display:block;background:var(--folha);border:1px solid var(--linha);border-radius:14px;padding:14px 15px}
.sem-card:hover{border-color:var(--quente)}.sem-card.c-v{background:#E8F0E3;border-color:#C9D9C1}.sem-card.c-a{background:#F8EFD6;border-color:#E6D5A4}.sem-card.c-r{background:#F7E3DC;border-color:#E6BFB3}
.sem-card:focus-visible{outline:2px solid var(--saldo);outline-offset:2px}
.sem-card.on{box-shadow:inset 0 0 0 2px var(--tinta);border-color:var(--tinta)}
.sem-card .per{font-weight:700;font-size:16px}
.sem-card dl{display:grid;grid-template-columns:1fr auto;gap:2px 10px;margin:9px 0 0;font-size:14.5px}
.sem-card dt{color:var(--tinta2)}.sem-card dd{margin:0;font-weight:700;text-align:right;white-space:nowrap}
.dias7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin:12px 0}
.d7{all:unset;box-sizing:border-box;cursor:pointer;background:#F0EEE6;border-radius:9px;padding:7px 9px;font-size:14px;min-width:0}
.d7:hover{box-shadow:inset 0 0 0 2px var(--quente)}.d7 b{display:block;font-size:15px;white-space:nowrap}.d7.neg{background:var(--critico-bg)}.d7.hj{box-shadow:inset 0 0 0 2px var(--tinta)}
.duas{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.rol{max-height:440px;overflow:auto}
.som{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 6px}
@media (max-width:980px){.semanas{grid-template-columns:1fr 1fr}.duas{grid-template-columns:1fr}.dias7{grid-template-columns:repeat(4,minmax(0,1fr))}}
.btn-classe{all:unset;cursor:pointer;display:inline-flex;gap:4px;flex-wrap:wrap}
.btn-classe:focus-visible{outline:2px solid var(--saldo);outline-offset:2px}
.btn-classe:hover .pill{filter:brightness(.95)}
.p-vazio{background:none;color:var(--tinta3);box-shadow:inset 0 0 0 1px #CFCBC0;font-weight:400}
.etq-lin{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:7px 0;border-top:1px solid var(--calmo)}
.cores{display:flex;gap:5px;flex-wrap:wrap;flex:1}
.cor{width:28px;height:28px;border-radius:50%;border:0;cursor:pointer;padding:0}
.cor.on{box-shadow:0 0 0 2px var(--folha),0 0 0 4px var(--tinta)}
.sel{border:1px solid #CFCBC0;border-radius:8px;padding:5px 8px;background:#fff;min-height:34px}
table.tot td,table.tot th{font-size:16px;padding:11px 14px}
.tot-lin td{font-weight:700;background:var(--saldo-bg)}
.tot-sub{color:var(--tinta3);font-size:14px;font-weight:400;margin-left:6px}
.abas{order:3;flex:1 1 100%;overflow-x:auto;min-width:0}
.sync{margin-left:auto}
.sem-p{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;font-style:normal;font-size:12px;font-weight:700;color:#fff;margin-right:6px;flex:none;vertical-align:-3px}
.sem-v{background:#55704F}.sem-a{background:#96702A}.sem-r{background:#9C4436}
.leg-sem{display:flex;gap:18px;flex-wrap:wrap;font-size:14.5px;color:var(--tinta2)}
.leg-sem span{display:flex;align-items:center;gap:4px}.leg-sem b{color:var(--tinta);font-weight:600}
.dia.c-v{background:#DCE8D6;color:#2F4A2B}.dia.c-a{background:#F3E5BE;color:#634813}.dia.c-r{background:#F2D5CC;color:#7F3327}
.dia .e{font-size:13px;font-weight:600;display:flex;justify-content:space-between;gap:4px}
.stat.t-c-v{background:#55704F;border-color:transparent;color:#fff}.stat.t-c-a{background:#96702A;border-color:transparent;color:#fff}.stat.t-c-r{background:#9C4436;border-color:transparent;color:#fff}
.stat.t-c-v .rot,.stat.t-c-a .rot,.stat.t-c-r .rot,.stat.t-c-v .sub,.stat.t-c-a .sub,.stat.t-c-r .sub{color:#F3F1E8}
.d7.c-v{background:#DCE8D6}.d7.c-a{background:#F3E5BE}.d7.c-r{background:#F2D5CC}
.gloss summary{cursor:pointer;font:400 15px var(--titulo)}
.gloss dl{margin:12px 0;display:grid;grid-template-columns:minmax(170px,240px) 1fr;gap:8px 16px}
.gloss dt{font-weight:700}.gloss dd{margin:0;color:var(--tinta2)}
@media (max-width:700px){.gloss dl{grid-template-columns:1fr}}
@media (max-width:700px){
  .topo{position:static}
  .topo-in{padding:8px 12px;gap:8px}
  .sync{order:2;margin-left:0;flex:1 1 100%}
  main{padding:12px}
  .grade{grid-template-columns:1fr!important}
  .dupla{grid-template-columns:1fr!important}
  .mini-stats{grid-template-columns:1fr 1fr!important}
  .semanas{grid-template-columns:1fr}
  .dia{min-height:58px;padding:4px 5px}.dia .f{font-size:11.5px;white-space:normal}
  .boas{margin-top:3vh}
  .stat .val{font-size:22px}
  .faixa.f-grande .tx{font-size:17px}
  .seg button{padding:6px 9px;font-size:14px}
  .abas{scrollbar-width:none}
  .leg-sem span{display:block}
}
.areas-grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.area-card{display:flex;flex-direction:column}
.area-num{display:grid;grid-template-columns:1fr auto;gap:3px 10px;margin:4px 0;font-size:15px}
.area-num dt{color:var(--tinta2)}.area-num dd{margin:0;font-weight:700;white-space:nowrap}
.navm,.hero-m,.so-mob,.mais-m{display:none}
@media (max-width:700px){
  .abas,.topo-in>.btn{display:none!important}
  .topo-in{flex-wrap:nowrap}
  .marca{font-size:15px;flex:none}
  .sync{order:0;flex:1 1 auto;margin-left:auto;font-size:12.5px;justify-content:flex-end;text-align:right}
  main{padding-bottom:100px}
  .so-desk{display:none!important}
  .so-mob{display:block}
  .navm{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--folha);border-top:1px solid var(--linha);padding:4px 2px calc(4px + env(safe-area-inset-bottom));box-shadow:0 -2px 10px rgba(36,33,30,.06)}
  .navm button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;color:var(--tinta3);min-height:56px}
  .navm button.on{color:var(--tinta)}
  .navm button.on svg{stroke-width:2.6}
  .navm svg{width:24px;height:24px}
  .mais-m{display:flex;flex-direction:column;position:fixed;left:8px;right:8px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:41;background:var(--folha);border-radius:16px;padding:8px;box-shadow:0 8px 30px rgba(36,33,30,.25)}
  .mais-m button{border:0;background:none;text-align:left;font-size:17px;font-weight:600;padding:14px;border-radius:10px;min-height:48px}
  .mais-m button.on,.mais-m button:active{background:var(--calmo)}
  .hero-m{display:block;border-radius:18px;overflow:hidden;margin-bottom:12px;color:#fff}
  .st-v{background:#55704F}.st-a{background:#96702A}.st-r{background:#9C4436}
  .hm-top{all:unset;box-sizing:border-box;display:flex;gap:14px;align-items:center;width:100%;padding:18px;cursor:pointer}
  .hm-ic{flex:none;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:26px;font-weight:700}
  .hm-tx>span{display:block}
  .hm-t{font-size:17px;font-weight:700}
  .hm-n{font-size:34px;font-weight:700;line-height:1.15}
  .hm-s{font-size:14px;opacity:.92}
  .hm-al{all:unset;box-sizing:border-box;display:block;width:100%;padding:12px 18px;background:rgba(0,0,0,.18);cursor:pointer}
  .hm-al b{display:block;font-size:16px}
  .hm-al span{display:block;font-size:14px;opacity:.92}
  .dm{all:unset;box-sizing:border-box;display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:13px 14px;background:var(--folha);border:1px solid var(--linha);border-radius:12px;margin-bottom:6px;cursor:pointer}
  .dm.hj{border:2px solid var(--tinta)}
  .dm-d b{display:block;font-size:16px}
  .dm-d small{display:block;color:var(--tinta3);font-size:13.5px}
  .dm-v{font-size:16px;font-weight:700;white-space:nowrap}
  #toast{bottom:calc(84px + env(safe-area-inset-bottom))!important}
}
.com-grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.com-card{background:var(--folha);border:1px solid var(--linha);border-left:5px solid var(--calmo);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.cc-ok{border-left-color:#55704F}.cc-breve{border-left-color:#C49A3C}.cc-prev{border-left-color:#44687A}
.com-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.com-top b{display:block;font-size:17px}.com-top small{display:block;color:var(--tinta3);font-size:14px}
.com-quem{font-size:15px}
.com-barra{height:8px;background:var(--calmo);border-radius:99px;overflow:hidden}.com-barra i{display:block;height:100%;background:var(--entra);border-radius:99px}
.com-num{display:grid;grid-template-columns:1fr auto;gap:2px 10px;margin:0;font-size:14.5px}.com-num dt{color:var(--tinta2)}.com-num dd{margin:0;font-weight:700;text-align:right}
.com-acoes{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.cc-atraso{border-left-color:#C49A3C;background:#FBF6E8}
.ms-atr{background:#FBF6E8!important;border-color:#E6D5A4!important}.ms-atr b{color:#7A5A12}
.cc-pago{border-left-color:#55704F;opacity:.85}
.com-val{font-weight:700;font-size:17px;white-space:nowrap}
.com-passo{display:block;white-space:normal;line-height:1.35;padding:7px 11px;border-radius:10px;font-size:14.5px}
.linha-tempo{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;counter-reset:p}
.linha-tempo li{position:relative;padding-top:16px;font-size:12.5px;line-height:1.25;color:var(--tinta3)}
.linha-tempo li::before{content:'';position:absolute;top:2px;left:0;width:11px;height:11px;border-radius:50%;background:var(--calmo);box-shadow:0 0 0 2px var(--folha)}

  if(a>=1e6)return s+(a/1e6).toLocaleString('pt-BR',{maximumFractionDigits:a>=1e7?0:1})+' mi';
  if(a>=1e3)return s+Math.round(a/1e3).toLocaleString('pt-BR')+' mil';

function lerValor(t){
  if(typeof t==='number')return t;
  let s=String(t||'').replace(/[R$\s]/g,'');if(!s)return NaN;
  const neg=s.startsWith('-');s=s.replace(/^-/,'');

function lerData(v){

}
const num=v=>{if(v==null||v==='')return 0;if(typeof v==='number')return v;const n=lerValor(v);return isNaN(n)?0:n};

/* ========== leitor de .xlsx (sem bibliotecas externas) ========== */
async function descomprimir(bytes){
  const st=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(st).arrayBuffer());
}
async function abrirZip(buf){
  const u8=new Uint8Array(buf),dv=new DataView(buf);
  let e=-1;for(let i=u8.length-22;i>=0&&i>=u8.length-70000;i--)if(dv.getUint32(i,true)===0x06054b50){e=i;break}
  if(e<0)throw new Error('zip');
  const tot=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const ent={};const dec=new TextDecoder();
  for(let i=0;i<tot;i++){
    if(dv.getUint32(p,true)!==0x02014b50)break;
    const met=dv.getUint16(p+10,true),cs=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),off=dv.getUint32(p+42,true);
    ent[dec.decode(u8.subarray(p+46,p+46+nl))]={met,cs,off};p+=46+nl+xl+cl;
  }
  return {nomes:Object.keys(ent),async ler(n){
    const x=ent[n];if(!x)return null;
    const ini=x.off+30+dv.getUint16(x.off+26,true)+dv.getUint16(x.off+28,true);
    const d=u8.subarray(ini,ini+x.cs);
    return new TextDecoder().decode(x.met===8?await descomprimir(d):d);
  }};
}
const ent=s=>s.indexOf('&')<0?s:s.replace(/&(#x?[0-9a-fA-F]+|amp|lt|gt|quot|apos);/g,(m,c)=>({amp:'&',lt:'<',gt:'>',quot:'"',apos:"'"}[c]||String.fromCodePoint(c[1]==='x'?parseInt(c.slice(2),16):+c.slice(1))));

function lerFolha(xml,ss){
  const rows=[],rx=/<row\b([^>]*?)(?:\/>|>([\s\S]*?)<\/row>)/g,cx=/<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g;let m,auto=0;
  while((m=rx.exec(xml))){
    auto++;const rr=m[1].match(/\br="(\d+)"/);const r=rr?+rr[1]:auto;auto=r;
    if(!m[2])continue;const lin=[];let c;cx.lastIndex=0;
    while((c=cx.exec(m[2]))){
      if(!c[2])continue;
      const ref=c[1].match(/\br="([A-Z]+)\d+"/);if(!ref)continue;
      const tp=(c[1].match(/\bt="(\w+)"/)||[])[1];let v;
      if(tp==='inlineStr'){v=ent((c[2].match(/<t[^>]*>([\s\S]*?)<\/t>/)||[])[1]||'')}
      else{const vv=c[2].match(/<v>([\s\S]*?)<\/v>/);if(!vv)continue;
        if(tp==='s')v=ss[+vv[1]];else if(tp==='str')v=ent(vv[1]);else if(tp==='e')continue;else if(tp==='b')v=vv[1]==='1';else v=+vv[1]}
      lin[colNum(ref[1])]=v;
    }
    rows.push({r,c:lin});
  }
  return rows;
}
const norm=s=>String(s==null?'':s).normalize('NFD').replace(/[^a-zA-Z0-9]/g,'').toLowerCase();
function mapa(lin){const o={};(lin||[]).forEach((v,i)=>{if(v==null)return;const k=norm(v);if(!(k in o))o[k]=i});return o}

async function lerPlanilha(buf,nome,salvoEm){
  let z;try{z=await abrirZip(buf)}catch(e){throw new Error('Este arquivo não é uma planilha .xlsx válida. Abra no Excel e salve como .xlsx.')}
  const wb=await z.ler('xl/workbook.xml');if(!wb)throw new Error('Este arquivo não é uma planilha do Excel.');
  const rels=await z.ler('xl/_rels/workbook.xml.rels')||'';
  const alvo={};for(const m of rels.matchAll(/<Relationship\b[^>]*>/g)){const id=(m[0].match(/\bId="([^"]+)"/)||[])[1],t=(m[0].match(/\bTarget="([^"]+)"/)||[])[1];if(id&&t)alvo[id]=t.startsWith('/')?t.slice(1):'xl/'+t}
  const folhas=[];for(const m of wb.matchAll(/<sheet\b[^>]*>/g)){const n=(m[0].match(/\bname="([^"]+)"/)||[])[1],id=(m[0].match(/r:id="([^"]+)"/)||[])[1];folhas.push({nome:ent(n||''),arq:alvo[id]})}
  const sx=await z.ler('xl/sharedStrings.xml')||'';const ss=[];
  for(const m of sx.matchAll(/<si>([\s\S]*?)<\/si>|<si\/>/g)){
    let t='';const corpo=(m[1]||'').replace(/<rPh[\s\S]*?<\/rPh>/g,'');
    for(const x of corpo.matchAll(/<t(?:\s[^>]*)?>([\s\S]*?)<\/t>/g))t+=x[1];
    ss.push(ent(t));
  }
  const acha=n=>folhas.find(f=>norm(f.nome)===norm(n));
  /* --- recebimentos --- */
  let fR=acha('Sheet1'),linR=fR&&lerFolha(await z.ler(fR.arq),ss);
  const ehR=l=>{const h=l&&l[0]&&mapa(l[0].c);return h&&'vencimento' in h&&'valorcorrigido' in h&&'valorpago' in h};
  if(!ehR(linR)){fR=null;for(const f of folhas){const nf=norm(f.nome);if(!/rece|carteira|clientes|extrato/.test(nf))continue;const l=lerFolha(await z.ler(f.arq),ss);if(ehR(l)){fR=f;linR=l;break}}}
  if(!fR)throw new Error('Não encontrei a aba de recebimentos (com as colunas Vencimento, Valor Corrigido e Valor Pago).');
  const cabR=linR[0].c,hR=mapa(cabR);
  let colPag=cabR.findIndex(v=>String(v).trim()==='Data');
  if(colPag<0)colPag=hR.data;

    const pc=Object.keys(hR).find(k=>k.startsWith('permuta'));
    const per=pc?num(c[hR[pc]]):0;
    const db=lerData(c[hR.database]);if(db&&(!dataBase||db>dataBase))dataBase=db;
    const pd=lerData(c[colPag]);
    const u=num(c[hR.valorpago]);
    if(!pd&&u>0)aR++;
    receb.push({id:String(c[hR.n]??r),ct:String(c[hR.contrato]??''),vc:num(c[hR.valorcontrato]),d,v:bruto-per,bruto,per,pd,pg:u,cli:String(c[hR.cliente]||'').replace(/^\d+\s*-\s*/,''),un:c[hR.unidade]??'',parc:c[hR.sequencia]||'',tipo:c[hR.tipo]||''});
  }
  /* --- despesas --- */
  const ehD=l=>{const h=l&&l[0]&&mapa(l[0].c);return h&&'datavencimento' in h&&'valorparcela' in h};
  let fD=acha('the One despesas'),linD=fD&&lerFolha(await z.ler(fD.arq),ss);
  if(!ehD(linD)){fD=null;for(const f of folhas){if(!/despesa|pagamento/.test(norm(f.nome))||/aporte/.test(norm(f.nome)))continue;const l=lerFolha(await z.ler(f.arq),ss);if(ehD(l)){fD=f;linD=l;break}}}
  if(!fD)throw new Error('Não encontrei a aba de despesas (“the One despesas”).');
  const hD=mapa(linD[0].c),desp=[];let semData=[],pagoSemData=[],dataInvalida=[],ignoradas=[];
  for(const {r,c} of linD.slice(1)){
    const forn=c[hD.prestadorservico];
    const val=typeof c[hD.valorparcela]==='number'?c[hD.valorparcela]:(typeof c[hD.valortotal]==='number'?c[hD.valortotal]:0);
    const brutaD=c[hD.datavencimento];
    const d=lerData(brutaD);
    if(!val&&!d){if(c.some(x=>x!=null&&x!==''))ignoradas.push(r);continue}
    const pd=lerData(c[hD.datapagamento]),pg=num(c[hD.valorpago]);
    if(d==null){if(val>0&&forn&&isNaN(lerValor(forn)))semData.push({linha:r,forn:String(forn),v:val,pg,pago:!!pd||pg>0});continue}
    /* data que não existe no calendário (ex.: 31/09): mantém o valor no fluxo e avisa */
    if(typeof brutaD==='string'&&fData(d)!==brutaD.trim().replace(/^(\d)\//,'0$1/').replace(/\/(\d)\//,'/0$1/'))dataInvalida.push({linha:r,forn:String(forn||''),texto:brutaD,v:val,usada:d});
    const it={id:[forn,c[hD.ndoc],c[hD.nparcela],d,val].join('|'),d,v:val,pd,pg,pago:!!pd||pg>0,forn:String(forn||'(sem fornecedor)').trim(),nat:c[hD.natureza]||'',tipoDoc:c[hD.tipodoc]||'',doc:c[hD.ndoc]??'',parc:c[hD.nparcela]||'',forma:c[hD.formadepagamento]||'',prod:String(c[hD.produtoservico]||'').trim(),obs:c[hD.statusobservacao]||''};

  if(fA){
    const lA=lerFolha(await z.ler(fA.arq),ss);
    const cab=lA.find(l=>{const m=mapa(l.c);return 'mes' in m&&Object.keys(m).some(k=>k.startsWith('obra'))});
    if(cab){
      const m=mapa(cab.c);const ob=m[Object.keys(m).find(k=>k.startsWith('obra'))];

/* ========== armazenamento local (nada sai do computador) ========== */
let db;
const abrirDB=()=>new Promise((ok,no)=>{const q=indexedDB.open('caixa-the-one',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>ok(db=q.result);q.onerror=()=>no(q.error)});
const dbGet=k=>new Promise((ok,no)=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)});

const NUVEM={url:'https://qctsoopgccqavflgmtts.supabase.co',chave:'sb_publishable_Sw-pfjPVS2ghh7JMVU3S2Q_0Jrs6lwx'};

  }

  dia(H).atrasoS=totAS;dia(H).sp+=totAS;
  if(cfg.contarAtrasoR){dia(H).atrasoR=totAR;dia(H).ep+=totAR}
  for(const l of cfg.manuais){const c=dia(l.d);
    if(l.d<=H){if(l.tipo==='e')c.er+=l.v;else c.sr+=l.v}else{if(l.tipo==='e')c.ep+=l.v;else c.sp+=l.v}}
  const comPrev=cfg.cenario==='com'&&dados.prev.length>0;
  let totPrev=0;
  for(const p of dados.prev){
    const dt=toD(p.mes),y=dt.getUTCFullYear(),m=dt.getUTCMonth();
    const fimM=deYMD(y,m+1,0);if(fimM<H)continue;
    totPrev+=p.v;if(!comPrev)continue;
    const d=Math.max(H,Math.min(deYMD(y,m,cfg.diaPrev),fimM));
    const c=dia(d);c.sp+=p.v;c.fc.push(p);
  }
  const ancoras=[...cfg.saldos].sort((a,b)=>a.d-b.d);
  const ini=ancoras.length?ancoras[0].d:H;
  const chaves=Object.keys(mov).map(Number);
  const fim=Math.max(H+365,...chaves);
  const anc=Object.fromEntries(ancoras.map(a=>[a.d,a]));
  const dias=[],idx={};let s=ancoras.length?ancoras[0].v:0,prevFim=null;
  for(let d=ini;d<=fim;d++){
    const c=mov[d]||{ep:0,er:0,sp:0,sr:0,fc:[],atrasoS:0,atrasoR:0};
    let dif=null;
    if(anc[d]){if(prevFim!=null)dif=anc[d].v-prevFim;s=anc[d].v}
    const abre=s;
    const delta=d<H?c.er-c.sr:c.er+c.ep-c.sr-c.sp;
    s=abre+delta;prevFim=s;
    idx[d]=dias.length;dias.push({d,ini:abre,fim:s,dif,banco:!!anc[d]});
  }
  /* aportes: quanto colocar, e quando, para nunca ficar abaixo do caixa mínimo */
  let cum=0;const aportes=[];
  for(const x of dias){if(x.d<H)continue;const v=x.fim+cum;if(v<cfg.minimo-.005){const q=cfg.minimo-v;cum+=q;aportes.push({d:x.d,v:q})}}
  /* folga: quanto dá para gastar neste dia sem furar o caixa na janela seguinte */
  const fol={};const n=dias.length,J=cfg.janela;
  for(let i=idx[H];i<n;i++){let mn=Infinity;for(let k=i;k<Math.min(n,i+J+1);k++)if(dias[k].fim<mn)mn=dias[k].fim;fol[dias[i].d]=mn-cfg.minimo}
  /* semáforo de cada dia */
  const sem={};
  for(let i=idx[H];i<n;i++){
    const x=dias[i];let r30=0;for(let d=Math.max(H,x.d-29);d<=x.d;d++){const c=mov[d];if(c)r30+=c.ep}
    if(x.fim<cfg.minimo-.005){sem[x.d]={c:'r',m:'Abaixo do Caixa mínimo neste dia'};continue}
    if(fol[x.d]<=.005){let dF=null;for(let k=i+1;k<Math.min(n,i+J+1);k++)if(dias[k].fim<cfg.minimo-.005){dF=dias[k].d;break}
      sem[x.d]={c:'a',m:dF?`Vai faltar em ${fData(dF)}`:'Sem Folga de caixa'};continue}
    if(x.fim-r30<cfg.minimo-.005){sem[x.d]={c:'a',m:'Depende de receber'};continue}
    sem[x.d]={c:'v',m:'Paga mesmo sem receber nos últimos 30 dias'};
  }
  const ultDif=[...dias].reverse().find(x=>x.dif!=null&&Math.abs(x.dif)>=.01);
  const dbs=dados.meta.dataBase;const inad=atrasoR.filter(x=>!dbs||x.d<dbs),aguard=atrasoR.filter(x=>dbs&&x.d>=dbs);
  return {sem,inad,aguard,totInad:inad.reduce((a,x)=>a+x.v,0),totAguard:aguard.reduce((a,x)=>a+x.v,0),H,mov,dias,idx,aportes,totAporte:cum,atrasoR,atrasoS,totAR,totAS,fol,comPrev,totPrev,ini,fim,semSaldo:!ancoras.length,ultDif};
}

function toast(t,ms=6000){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',ms)}
function resumoDif(a,b){
  if(!a)return `${b.receb.length} recebimentos e ${b.desp.length} despesas carregados.`;
  const pa=new Set(a.receb.filter(x=>x.pd!=null).map(x=>x.id));
  const novosR=b.receb.filter(x=>x.pd!=null&&!pa.has(x.id)).length;
  const ida=new Set(a.desp.map(x=>x.id)),pgA=new Set(a.desp.filter(x=>x.pago).map(x=>x.id));
  const novasD=b.desp.filter(x=>!ida.has(x.id)).length,pagasD=b.desp.filter(x=>x.pago&&!pgA.has(x.id)).length;
  const p=[];if(novosR)p.push(`${novosR} recebimento(s) com baixa`);if(novasD)p.push(`${novasD} parcela(s) nova(s) em the One despesas`);if(pagasD)p.push(`${pagasD} parcela(s) paga(s)`);
  return p.length?'Planilha atualizada: '+p.join(', ')+'.':'Planilha atualizada. Nenhuma baixa nova.';
}
async function importar(buf,nome,salvoEm){
  const novo=await lerPlanilha(buf,nome,salvoEm);
  const antigo=dados;dados=novo;
  await segSet('dados',novo);rec();render();
  toast(resumoDif(antigo,novo));
  if(!antigo&&!cfg.saldos.length)dlgSaldo(true);
}
async function escolher(){
  if(window.showOpenFilePicker){
    try{
      const [h]=await showOpenFilePicker({multiple:false,types:[{description:'Planilha do Excel',accept:{'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':['.xlsx'],'application/vnd.ms-excel.sheet.macroEnabled.12':['.xlsm']}}]});
      await ligar(h);
    }catch(e){if(e.name!=='AbortError')falha(e)}

}
async function ligar(h){
  const f=await h.getFile();
  await importar(await f.arrayBuffer(),f.name,f.lastModified);
  handle=h;syncEstado='auto';erroSync=null;ultimaChecagem=Date.now();
  try{await dbSet('handle',h)}catch(e){}
  await dbSet('lastMod',f.lastModified);render();
}
function falha(e){
  const m=e&&(e.name==='NotAllowedError'||e.name==='SecurityError')?'Este navegador não permite ligar o arquivo. Use Anexar a planilha.':e&&e.name==='NotReadableError'?'O Excel está salvando o arquivo. Tente de novo em alguns segundos.':(e&&e.message)||'Não consegui ler esse arquivo.';
  toast(m,9000);
}
async function checar(){
  if((!chave&&!sessao)||souLeitor()||!handle||syncEstado!=='auto')return;
  try{
    const f=await handle.getFile();
    ultimaChecagem=Date.now();erroSync=null;
    const lm=await dbGet('lastMod');
    if(f.lastModified!==lm){await importar(await f.arrayBuffer(),f.name,f.lastModified);await dbSet('lastMod',f.lastModified)}
    else atualizaSync();
  }catch(e){erroSync=e.name==='NotFoundError'?'sumiu':'ocupado';atualizaSync()}
}
async function reconectar(){
  try{
    const p=await handle.requestPermission({mode:'read'});
    if(p==='granted'){syncEstado='auto';await checar();render()}
  }catch(e){falha(e)}
}

  e.preventDefault();contDrag=0;$('#arrasta').style.display='none';if(authTela||souLeitor())return;
  const it=e.dataTransfer.items&&e.dataTransfer.items[0];
  const ph=it&&it.getAsFileSystemHandle?it.getAsFileSystemHandle():null;
  const f=e.dataTransfer.files[0];if(!f)return;
  if(!/\.xls[xm]$/i.test(f.name)){toast('Use um arquivo .xlsx do Excel.');return}

const tt=$('#tt');
function mostraTT(x,y,html){tt.innerHTML=html;tt.style.display='block';const w=tt.offsetWidth,h=tt.offsetHeight;let l=x+14,t=y-h-12;if(l+w>innerWidth-8)l=x-w-14;if(t<8)t=y+16;tt.style.left=l+'px';tt.style.top=t+'px'}
const escondeTT=()=>tt.style.display='none';
function ticks(mn,mx,n=4){
  if(mn===mx){mn-=1;mx+=1}
  const p=(mx-mn)/n,m=Math.pow(10,Math.floor(Math.log10(p))),e=p/m,st=(e<1.5?1:e<3?2:e<7?5:10)*m;
  const a=[];for(let v=Math.floor(mn/st)*st;;v+=st){a.push(Math.abs(v)<st/1e6?0:v);if(v>=mx-st/1e6)break}return a;
}
function grafLinha(el,serie,op={}){
  const W=el.clientWidth||800,Ht=op.altura||290,L=62,Rr=16,T=16,B=30,pw=W-L-Rr,ph=Ht-T-B;
  const todos=serie.flatMap(p=>op.segunda?[p.v,p.v2]:[p.v]);
  const tk=ticks(Math.min(0,...todos),Math.max(0,...todos));
  const y0=tk[0],y1=tk[tk.length-1];
  const X=i=>L+(serie.length<2?0:i/(serie.length-1)*pw),Y=v=>T+ph-(v-y0)/(y1-y0)*ph;
  const path=k=>serie.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p[k]).toFixed(1)).join('');
  const zero=Y(0);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${Ht}" width="${W}" height="${Ht}" role="img" aria-label="${esc(op.aria||'Saldo projetado por dia')}" tabindex="0">`;
  for(const t of tk){s+=`<line x1="${L}" x2="${W-Rr}" y1="${Y(t)}" y2="${Y(t)}" stroke="${t===0?'#A29C90':'#E4E2D6'}" stroke-width="1"/><text x="${L-8}" y="${Y(t)+4}" text-anchor="end" font-size="13" fill="#6E665D" style="font-variant-numeric:tabular-nums">${t===0?'R$ 0':comp(t)}</text>`}
  /* eixo x: início de cada mês, ou semanas em períodos curtos */
  const passos=serie.length<=45?7:0;let ultX=-99;
  serie.forEach((p,i)=>{const dt=toD(p.d);const marca=passos?i%passos===0:dt.getUTCDate()===1;if(!marca)return;const x=X(i);if(x-ultX<52)return;ultX=x;
    s+=`<text x="${x}" y="${Ht-9}" text-anchor="middle" font-size="13" fill="#6E665D">${passos?fCurta(p.d):fMesC(p.d)}</text>`});
  /* lavagem suave abaixo da linha; vermelho quando negativo */
  const cid='c'+Math.random().toString(36).slice(2,8);
  const area=path('v')+`L${X(serie.length-1)} ${zero}L${X(0)} ${zero}Z`;
  s+=`<defs><clipPath id="${cid}n"><rect x="${L}" y="${zero}" width="${pw}" height="${Math.max(0,T+ph-zero)}"/></clipPath><clipPath id="${cid}p"><rect x="${L}" y="${T}" width="${pw}" height="${Math.max(0,zero-T)}"/></clipPath></defs>`;
  s+=`<path d="${area}" fill="#44687A" opacity=".11" clip-path="url(#${cid}p)"/><path d="${area}" fill="#9C4436" opacity=".18" clip-path="url(#${cid}n)"/>`;
  if(op.minimo){s+=`<line x1="${L}" x2="${W-Rr}" y1="${Y(op.minimo)}" y2="${Y(op.minimo)}" stroke="#96702A" stroke-width="1"/>`}
  if(op.segunda)s+=`<path d="${path('v2')}" fill="none" stroke="#B0663F" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  s+=`<path d="${path('v')}" fill="none" stroke="#44687A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  /* menor saldo destacado */
  let iMin=0;const k=op.segunda?'v2':'v';serie.forEach((p,i)=>{if(p[k]<serie[iMin][k])iMin=i});
  const mx=X(iMin),my=Y(serie[iMin][k]);
  const txt=`Menor Disponibilidade: ${R(serie[iMin][k])} em ${fCurta(serie[iMin].d)}`;
  const ancora=mx>W-180?'end':mx<L+150?'start':'middle';
  const ty=my>T+ph-22?my-13:my+22;
  s+=`<circle cx="${mx}" cy="${my}" r="5" fill="${serie[iMin][k]<0?'#9C4436':'#44687A'}" stroke="#FBFAF6" stroke-width="2"/><text x="${mx}" y="${ty}" text-anchor="${ancora}" font-size="14" font-weight="600" fill="#33302B" paint-order="stroke" stroke="#FBFAF6" stroke-width="3">${esc(txt)}</text>`;
  if(!op.segunda){const larguraD=Math.max(1,pw/Math.max(1,serie.length-1));serie.forEach((p,i)=>{const z=semDe(p.d);if(!z)return;s+=`<rect x="${(X(i)-larguraD/2).toFixed(1)}" y="${T+ph-5}" width="${(larguraD+.6).toFixed(1)}" height="5" fill="${{v:'#55704F',a:'#C49A3C',r:'#9C4436'}[z.c]}"/>`})}
  s+=`<g class="hov" style="display:none"><line y1="${T}" y2="${T+ph}" stroke="#766B60" stroke-width="1"/><circle r="5" fill="#44687A" stroke="#FBFAF6" stroke-width="2"/></g>`;
  s+=`<rect x="${L}" y="${T}" width="${pw}" height="${ph}" fill="transparent" style="cursor:pointer" class="ov"/></svg>`;
  el.innerHTML=s;

    let h=`<b>${fSem(p.d)}, ${fData(p.d)}</b><br>${op.segunda?'Sem a compra':'Disponibilidade'}: ${R(p.v)}`;if(op.segunda)h+=`<br>Com a compra: ${R(p.v2)}`;
    const m=mvz(p.d);if(!op.segunda&&(m.ep||m.sp||m.er||m.sr))h+=`<br>Recebível em Caixa ${R(m.ep+m.er)}<br>Despesas ${R(m.sp+m.sr)}`;

  svg.addEventListener('keydown',e=>{
    if(!['ArrowLeft','ArrowRight','Enter'].includes(e.key))return;e.preventDefault();

    const i=ati==null?0:Math.max(0,Math.min(serie.length-1,ati+(e.key==='ArrowRight'?1:-1)));
    const b=svg.getBoundingClientRect();mostra(i,b.left+X(i),b.top+Y(serie[i].v));
  });
  svg.addEventListener('blur',()=>{hov.style.display='none';escondeTT()});
}
function grafMeses(el,meses,op={}){
  const W=el.clientWidth||800,Ht=260,L=62,Rr=10,T=12,B=30,pw=W-L-Rr,ph=Ht-T-B;
  const tk=ticks(0,Math.max(1,...meses.flatMap(m=>[m.e,m.s])));const y1=tk[tk.length-1];
  const Y=v=>T+ph-v/y1*ph;const band=pw/meses.length,bw=Math.min(22,(band-10)/2);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${Ht}" width="${W}" height="${Ht}" role="img" aria-label="Recebível em Caixa e Despesas">`;
  for(const t of tk)s+=`<line x1="${L}" x2="${W-Rr}" y1="${Y(t)}" y2="${Y(t)}" stroke="${t===0?'#A29C90':'#E4E2D6'}"/><text x="${L-8}" y="${Y(t)+4}" text-anchor="end" font-size="13" fill="#6E665D" style="font-variant-numeric:tabular-nums">${t===0?'R$ 0':comp(t)}</text>`;
  const barra=(x,v,cor)=>{const h=Math.max(0,Y(0)-Y(v));if(h<1)return'';const r=Math.min(4,h);const y=Y(v);return `<path d="M${x} ${Y(0)}V${y+r}Q${x} ${y} ${x+r} ${y}H${x+bw-r}Q${x+bw} ${y} ${x+bw} ${y+r}V${Y(0)}Z" fill="${cor}"/>`};
  meses.forEach((m,i)=>{const cx=L+band*i+band/2;
    s+=barra(cx-bw-1,m.e,'#4A8A7A')+barra(cx+1,m.s,'#B0663F');
    s+=`<text x="${cx}" y="${Ht-9}" text-anchor="middle" font-size="13" fill="#6E665D">${band<46&&i%2?'':(op.eixo||fMesC)(m.d)}</text>`;
    s+=`<rect data-i="${i}" x="${L+band*i}" y="${T}" width="${band}" height="${ph}" fill="transparent" style="cursor:pointer"/>`;
  });
  el.innerHTML=s+'</svg>';

    r.addEventListener('mouseleave',escondeTT);
    r.addEventListener('click',()=>{escondeTT();if(op.clique){op.clique(m);return}ui.mesDia=m.d;ui.aba='dia';render()});

    const vcom=c.pcom?vc*(+c.pcom)/100:(+c.vcom||0);

function fluxosSim(valor,entrada,parcelas,inicio){
  const out=[];const rest=Math.max(0,valor-entrada),dt=toD(inicio);
  if(entrada>0)out.push({d:inicio,v:entrada});
  const desloc=entrada>0?1:0;
  for(let i=0;i<parcelas;i++){
    const y=dt.getUTCFullYear(),m=dt.getUTCMonth()+i+desloc;
    const ultimo=deYMD(y,m+1,0);
    out.push({d:Math.min(deYMD(y,m,dt.getUTCDate()),ultimo),v:rest/parcelas});
  }
  return out.filter(x=>x.v>0);
}
function avaliarSim(fl){
  const de=fl[0].d,ate=Math.min(M.fim,fl[fl.length-1].d+cfg.janela);
  let cum=0,mB=Infinity,mC=Infinity,pior=null;const mp={};fl.forEach(f=>mp[f.d]=(mp[f.d]||0)+f.v);
  for(let d=de;d<=ate;d++){const x=M.dias[M.idx[d]];if(!x)continue;cum+=mp[d]||0;const c=x.fim-cum;if(x.fim<mB)mB=x.fim;if(c<mC){mC=c;pior=d}}
  const fB=Math.max(0,cfg.minimo-mB),fC=Math.max(0,cfg.minimo-mC);
  return {extra:fC-fB,base:fB,com:fC,pior,de,ate};
}
function simular(){
  const s=ui.sim;s.valor=$('#sV').value;s.entrada=$('#sE').value;s.parcelas=$('#sP').value;s.data=$('#sD').value;
  const val=lerValor(s.valor),ent_=lerValor(s.entrada)||0,par=Math.max(1,Math.min(60,+s.parcelas||1));
  if(!(val>0)){toast('Digite o valor total da compra.');return}
  if(ent_>val){toast('A entrada não pode ser maior que o valor total.');return}
  if(!s.data){toast('Escolha a data do primeiro pagamento.');return}
  const ini=Math.max(M.H,deIso(s.data));
  const fl=fluxosSim(val,ent_,par,ini),ev=avaliarSim(fl);
  let sug=null;
  if(ev.extra>.5){for(let d=ini+1;d<=M.H+365;d++){const w=toD(d).getUTCDay();if(w===0||w===6)continue;const e=avaliarSim(fluxosSim(val,ent_,par,d));if(e.extra<=.5){sug=d;break}}}
  s.res={fl,ev,sug,val,ent:ent_,par,ini};
  desenhaSim();
}

function dadosSemana(seg){
  const H=M.H,fimS=seg+6;
  const rs=dados.receb.filter(r=>r.d>=seg&&r.d<=fimS).sort((a,b)=>a.d-b.d);
  const ds=despTodas().filter(x=>x.d>=seg&&x.d<=fimS).sort((a,b)=>a.d-b.d);
  const soma=(l,f)=>l.reduce((a,x)=>a+f(x),0);
  const porR=k=>rs.filter(r=>chaveR(r)===k);
  const rec={total:soma(rs,x=>x.v),pago:soma(porR('ok'),x=>x.pg),aberto:soma(porR('prev'),x=>x.v),inad:soma(porR('atr'),x=>x.v),agu:soma(porR('agu'),x=>x.v)};
  const dPagas=ds.filter(x=>x.pago),dAb=ds.filter(x=>!x.pago);
  /* o que ainda falta pagar nesta semana, de hoje em diante (inclui vencidas levadas para hoje e previsões mensais) */
  let aPagar=0,aReceber=0,prevMes=[];
  for(let d=Math.max(seg,H);d<=fimS;d++){const m=mvz(d);aPagar+=m.sp;aReceber+=m.ep;prevMes=prevMes.concat(m.fc)}
  const dias=[];for(let d=seg;d<=fimS;d++){const i=M.idx[d];dias.push({d,x:i!=null?M.dias[i]:null})}
  const com=dias.filter(z=>z.x);
  const ini=com.length?com[0].x.ini:null,fim=com.length?com[com.length-1].x.fim:null;
  /* teste: o caixa aguenta, mesmo se nada do Recebível em Caixa entrar? */
  let minCom=Infinity,minSem=Infinity,s=null;
  for(const z of com){if(z.d<H)continue;if(s==null)s=z.x.ini;const m=mvz(z.d);s+=m.er-m.sr-m.sp;if(s<minSem)minSem=s;if(z.x.fim<minCom)minCom=z.x.fim}
  const aporte=M.aportes.filter(a=>a.d>=seg&&a.d<=fimS).reduce((a,x)=>a+x.v,0);
  const ordem={v:0,a:1,r:2};let pior=null,motivo='';
  for(const z of com){if(z.d<H)continue;const q=semDe(z.d);if(q&&(!pior||ordem[q.c]>ordem[pior])){pior=q.c;motivo=q.m}}
  let sit;

  return {seg,rs,ds,rec,pago:soma(dPagas,x=>x.pg||x.v),desp:soma(ds,x=>x.v),aPagar,aReceber,prevMes,dias,ini,fim,aporte,sit,minCom};
}

function chavePeriodo(t,d){
  const x=toD(d),y=x.getUTCFullYear(),m=x.getUTCMonth();
  if(t==='dia')return{k:d,rot:`${fSem(d)}, ${fData(d)}`};
  if(t==='semana'){const s=segDe(d);return{k:s,rot:`${fCurta(s)} a ${fData(s+6)}`}}

  if(t==='semestre'){const n=m<6?1:2;return{k:y*10+n,rot:`${n}º semestre de ${y}`}}

}

function baseTotais(){

  for(const x of despTodas())if(!x.pago)o.push({d:x.d,r:0,s:x.v});

}

}

    </div>
    <label class="check" style="font-weight:400"><input type="checkbox" data-cfg="contarAtrasoR" ${cfg.contarAtrasoR?'checked':''}> Somar os recebimentos vencidos ao caixa de hoje</label>
    <div class="campo" style="margin-top:14px"><label>saldo bancario informado</label>${sal.length?`<ul class="lista">${sal.map(s=>`<li><span class="d">${fData(s.d)} · <b>${R2(s.v)}</b></span><button type="button" class="btn mini" data-a="delSaldo" data-v="${s.d}">Excluir</button></li>`).join('')}</ul>`:'<small>Nenhum ainda.</small>'}<div><button class="btn" data-a="saldo" style="margin-top:6px">Informar saldo bancario</button></div></div>
  </div>`;
}
function desenhaCfg(){
  if(emNuvem())desenhaPessoas();
  const e=$('#tabCfg');if(!e)return;const dim=ui.cfgDim,[t,nome]=DIMS[dim],q=norm(ui.cfgBusca);
  const lista=t==='s'?despTodas():dados.receb,g={};
  for(const it of lista){const k=it[dim]||'';if(!k)continue;const o=g[k]||(g[k]={k,n:0,ab:0});o.n++;if(t==='s'?!it.pago:it.pd==null)o.ab+=it.v}
  const ls=Object.values(g).filter(o=>!q||norm(o.k).includes(q)).sort((a,b)=>b.ab-a.ab);
  const reg=(cfg.regras[dim]||{});
  e.innerHTML=`<div class="tab-wrap" style="max-height:440px"><table><thead><tr><th>${nome}</th><th>Parcelas</th><th>${t==='s'?'Valor Parcela em aberto':'Em Aberto'}</th><th class="esq">Prioridade</th><th class="esq">Etiqueta (cor)</th></tr></thead><tbody>
  ${ls.slice(0,150).map(o=>{const r=reg[o.k]||{},cor=etq(r.e);return `<tr><td class="esq" style="white-space:normal">${cor?`<i class="chip" style="background:${cor.cor};margin-right:6px"></i>`:''}${esc(dim==='tipo'?(NOME_TIPO[o.k]||o.k):o.k)}</td><td class="num">${o.n}</td><td class="num">${R2(o.ab)}</td>
    <td class="esq"><select class="sel" data-cfg="regra" data-dim="${dim}" data-k="${esc(o.k)}" data-c="p" aria-label="Prioridade"><option value="">Sem prioridade</option>${Object.entries(PRIO).map(([k,v])=>`<option value="${k}" ${r.p===k?'selected':''}>${v[0]}</option>`).join('')}</select></td>
    <td class="esq"><select class="sel" data-cfg="regra" data-dim="${dim}" data-k="${esc(o.k)}" data-c="e" aria-label="Etiqueta"><option value="">Sem etiqueta</option>${cfg.etiquetas.map(x=>`<option value="${x.id}" ${r.e===x.id?'selected':''}>${esc(x.nome)}</option>`).join('')}</select></td></tr>`}).join('')}
  </tbody></table></div>${ls.length>150?`<p class="nota">Mostrando 150 de ${ls.length}. Use a busca.</p>`:''}`;
}
async function mudouConfig(ev){
  const n=ev.target,c=n.dataset&&n.dataset.cfg;if(!c)return;
  if(c==='regra'){const d=n.dataset.dim,k=n.dataset.k;cfg.regras[d]=cfg.regras[d]||{};const r=cfg.regras[d][k]||(cfg.regras[d][k]={p:'',e:''});r[n.dataset.c]=n.value;if(!r.p&&!r.e)delete cfg.regras[d][k];await salvarCfg();desenhaCfg();return}
  if(c==='etqNome'){const e=etq(n.dataset.e);if(e){e.nome=n.value.trim()||'Sem nome';await salvarCfg()}return}
  if(c==='minimo'){const v=lerValor(n.value);cfg.minimo=isNaN(v)?0:v}
  if(c==='diaPrev')cfg.diaPrev=Math.max(1,Math.min(31,+n.value||15));
  if(c==='janela')cfg.janela=Math.max(7,Math.min(365,+n.value||60));
  if(c==='contarAtrasoR')cfg.contarAtrasoR=n.checked;
  await salvarCfg();rec();toast('Salvo.',1500);
}
function dlgLanc(){
  const d=$('#dlg');
  d.innerHTML=`<form method="dialog" id="fL"><h2>Novo lançamento</h2>
    <div class="campo"><label for="lT">Tipo</label><select id="lT"><option value="s">Despesa</option><option value="e">Recebível (ex.: aporte)</option></select></div>
    <div class="campo"><label for="lX">Descrição</label><input id="lX" placeholder="Ex.: Aporte dos sócios" autofocus></div>
    <div class="dupla"><div class="campo"><label for="lV">Valor (R$)</label><input id="lV" inputmode="decimal"></div>
    <div class="campo"><label for="lD">Data</label><input id="lD" type="date" value="${iso(M.H)}"></div></div>
    <div class="acoes"><button type="button" class="btn" data-a="dlgFechar">Cancelar</button><button class="btn forte" type="submit">Salvar</button></div></form>`;
  d.showModal();
  $('#fL').addEventListener('submit',async e=>{
    const v=lerValor($('#lV').value);if(!(v>0)||!$('#lD').value){e.preventDefault();toast('Preencha o valor e a data.');return}
    cfg.manuais.push({id:'m'+Date.now(),tipo:$('#lT').value,desc:$('#lX').value||'Lançamento',v,d:deIso($('#lD').value)});await salvarCfg();rec();render();
  });
}

/* ---------- ações ---------- */
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v;
  if(ui.mais&&a!=='mais'&&a!=='aba'){ui.mais=false;document.querySelectorAll('.mais-m,.fundo[data-a=mais]').forEach(x=>x.remove())}
  if(souLeitor()&&['comEditar','anexar','areaInserir','areaLimpar','areaNova','areaDel','areaNome','saldo','escolher','novoLanc','delLanc','classificar','salvarSim','etqCor','etqNova','etqDel','limparRegras','delSaldo'].includes(a)){toast('Só a administradora pode alterar isso.');return}
  if(b.tagName==='INPUT')return;
  switch(a){
    case'escolher':escolher();break;
    case'anexar':$('#arq').click();break;
    case'totPer':ui.totPer=v;render();break;
    case'baixarPDF':baixarPDF();break;
    case'comFiltro':ui.com.f=v;render();break;
    case'comEditar':dlgComissao(v);break;
    case'comAvisos':ativarAvisos();break;
    case'comCopiar':copiarAviso(v);break;
    case'areaInserir':ui.areaAlvo=v;$('#arqArea').click();break;
    case'areaVer':ui.areaVer=ui.areaVer===v?'':v;render();break;
    case'areaLimpar':{const a=areas.lista.find(x=>x.id===v);if(a&&confirm(`Apagar o relatório de ${a.nome} do app? O arquivo original não é alterado.`)){a.itens=[];a.arquivo='';a.salvoEm=null;a.soma=false;await salvarAreas();rec();render()}break}
    case'areaNova':{const n=(prompt('Nome da nova área:')||'').trim();if(n){const usados=areas.lista.map(x=>x.cor);areas.lista.push({id:'a'+Date.now(),nome:n,cor:CORES.find(c=>!usados.includes(c))||CORES[0],soma:false,arquivo:'',salvoEm:null,itens:[]});await salvarAreas();render()}break}
    case'areaNome':{const a=areas.lista.find(x=>x.id===v);const n=a&&(prompt('Novo nome da área:',a.nome)||'').trim();if(n){a.nome=n;for(const it of a.itens)it.area=n;await salvarAreas();rec();render()}break}
    case'areaDel':{const a=areas.lista.find(x=>x.id===v);if(a&&confirm(`Excluir a área ${a.nome}${a.itens.length?' e o relatório dela':''}?`)){areas.lista=areas.lista.filter(x=>x.id!==v);if(ui.areaVer===v)ui.areaVer='';if(ui.rel.area===v)ui.rel.area='';await salvarAreas();rec();render()}break}
    case'sair':sair();break;
    case'esqueci':apagarConta();break;
    case'nvTela':emailPend=$('#cEmail')?$('#cEmail').value:emailPend;authTela=v;erroAuth='';avisoAuth='';render();break;
    case'nvVerif':try{await carregarNuvem()}catch(x){toast('Não foi possível verificar agora.')}break;
    case'nvReenvia':try{await req(`/auth/v1/resend?redirect_to=${voltaURL()}`,{metodo:'POST',auth:false,corpo:{type:'signup',email:emailPend}});avisoAuth='E-mail enviado de novo.';erroAuth=''}catch(x){erroAuth='Aguarde alguns minutos para pedir outro e-mail.'}render();break;
    case'nvEsqueci':{const m=($('#cEmail').value||'').trim();if(!m){erroAuth='Digite seu e-mail acima e clique de novo.';render();break}try{await req(`/auth/v1/recover?redirect_to=${voltaURL()}`,{metodo:'POST',auth:false,corpo:{email:m}});emailPend=m;avisoAuth='Se o e-mail tiver conta, chegou um link para criar nova senha.';erroAuth=''}catch(x){erroAuth='Aguarde alguns minutos e tente de novo.'}render();break}
    case'nvPapel':try{await req(`/rest/v1/perfis?id=eq.${v}`,{metodo:'PATCH',corpo:{papel:b.dataset.p}});pendentes=Math.max(0,pendentes-1);desenhaPessoas();contaPendentes()}catch(x){toast('Não foi possível alterar o acesso.')}break;
    case'calVer':ui.calVer=v;render();break;
    case'relPer':relPeriodo(v);break;
    case'relSet':ui.rel[b.dataset.c]=v;render();break;
    case'relPDF':baixarRelPDF();break;
    case'relXLS':baixarRelXLS();break;
    case'relLimpar':ui.rel={...ui.rel,area:'',de:'',ate:'',nat:'',pri:'',etq:'',busca:'',prev:false,sit:'aberto',orig:'ambos',modo:'total'};render();break;
    case'semana':ui.semana=+v;render();{const a=$('#detSem');if(a&&b.tagName==='TR')a.scrollIntoView({behavior:'smooth',block:'start'})}break;
    case'verPassadas':ui.verPassadas=!ui.verPassadas;render();break;
    case'reconectar':reconectar();break;
    case'aba':ui.aba=v;ui.mais=false;fecharPainel();render();scrollTo(0,0);break;
    case'mais':ui.mais=!ui.mais;render();break;
    case'ajustes':ui.aba='config';render();break;
    case'classificar':dlgClasse(b.dataset.t,v);break;
    case'cfgDim':ui.cfgDim=v;ui.cfgBusca='';render();break;
    case'etqCor':{const e=etq(b.dataset.e);if(e){e.cor=v;await salvarCfg();render()}break}
    case'etqNova':{const usado=cfg.etiquetas.map(x=>x.cor);cfg.etiquetas.push({id:'e'+Date.now(),nome:'Nova etiqueta',cor:CORES.find(c=>!usado.includes(c))||CORES[0]});await salvarCfg();render();break}
    case'etqDel':{cfg.etiquetas=cfg.etiquetas.filter(x=>x.id!==v);for(const d of Object.values(cfg.regras))for(const k in d)if(d[k].e===v)d[k].e='';await salvarCfg();render();break}
    case'limparRegras':if(confirm('Apagar todas as prioridades e etiquetas definidas?')){cfg.regras={};await salvarCfg();render()}break;
    case'saldo':dlgSaldo(false);break;
    case'dlgFechar':$('#dlg').close();break;
    case'dia':abrirDia(+v);break;
    case'fechar':fecharPainel();break;
    case'atraso':abrirAtraso(v);break;
    case'cenario':cfg.cenario=v;await salvarCfg();rec();render();break;
    case'periodo':ui.periodo=+v;render();break;
    case'verAportes':ui.verAportes=!ui.verAportes;render();break;
    case'mes':{const t=toD(ui.mesDia);ui.mesDia=deYMD(t.getUTCFullYear(),t.getUTCMonth()+ +v,1);render();break}
    case'mesHoje':ui.mesDia=null;render();break;
    case'mesCal':{const t=toD(ui.mesCal);ui.mesCal=deYMD(t.getUTCFullYear(),t.getUTCMonth()+ +v,1);render();break}
    case'simular':simular();break;
    case'usarData':ui.sim.valor=$('#sV').value;ui.sim.entrada=$('#sE').value;ui.sim.parcelas=$('#sP').value;ui.sim.data=iso(+v);$('#sD').value=iso(+v);if(lerValor(ui.sim.valor)>0)simular();break;
    case'simDia':ui.sim.data=iso(+v);ui.aba='datas';fecharPainel();render();$('#sV').focus();break;
    case'salvarSim':{const r=ui.sim.res;if(!r)break;const n=Date.now();r.fl.forEach((f,i)=>cfg.manuais.push({id:'m'+n+'_'+i,tipo:'s',desc:`Compra simulada (${i+1}/${r.fl.length})`,v:f.v,d:f.d}));ui.sim.res=null;await salvarCfg();rec();render();toast('Adicionado. Você pode excluir em Detalhes › Meus lançamentos.');break}
    case'detTipo':ui.det.tipo=v;ui.det.status='todos';ui.det.lim=200;render();break;
    case'detStatus':ui.det.status=v;ui.det.lim=200;render();break;
    case'maisDet':ui.det.lim+=300;desenhaDet();break;
    case'novoLanc':dlgLanc();break;
    case'delLanc':cfg.manuais=cfg.manuais.filter(x=>x.id!==v);await salvarCfg();rec();render();break;
    case'delSaldo':cfg.saldos=cfg.saldos.filter(s=>s.d!==+v);await salvarCfg();rec();$('#dlg').close();render();break;
  }
});
document.addEventListener('change',e=>{
  if(e.target.dataset.a==='soMov'){ui.soMov=e.target.checked;render()}
  if(e.target.dataset&&e.target.dataset.rel){const c=e.target.dataset.rel;ui.rel[c]=e.target.type==='checkbox'?e.target.checked:e.target.value;render()}
  if(e.target.dataset&&e.target.dataset.soma){const a=areas.lista.find(x=>x.id===e.target.dataset.soma);if(a){if(souLeitor()){e.target.checked=a.soma;toast('Só a administradora pode alterar isso.');return}a.soma=e.target.checked;salvarAreas();rec();render();toast(a.soma?a.nome+' agora soma no caixa.':a.nome+' saiu da conta do caixa.')}}
  if(e.target.id==='totPrev'){ui.totPrev=e.target.checked;render()}
  if(e.target.id==='fMes'){ui.det.mes=e.target.value;ui.det.lim=200;desenhaDet()}
  if(e.target.id==='fPri'){ui.det.fp=e.target.value;ui.det.lim=200;desenhaDet()}
  if(e.target.id==='fEtq'){ui.det.fe=e.target.value;ui.det.lim=200;desenhaDet()}
  if(e.target.id==='fAgr'){ui.det.agr=e.target.value;desenhaDet()}
  mudouConfig(e);
});
document.addEventListener('input',e=>{if(e.target.id==='busca'){ui.det.busca=e.target.value;ui.det.lim=200;desenhaDet()}if(e.target.id==='comBusca'){ui.com.q=e.target.value;desenhaCom()}if(e.target.id==='relBusca'){ui.rel.busca=e.target.value;desenhaRel()}if(e.target.id==='cfgBusca'){ui.cfgBusca=e.target.value;desenhaCfg()}});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')fecharPainel();
  if(e.key==='Enter'&&e.target.matches('tr[data-a="dia"]'))abrirDia(+e.target.dataset.v);
});
let tRes;addEventListener('resize',()=>{clearTimeout(tRes);tRes=setTimeout(()=>{if(ui.aba==='inicio')desenhaInicio();if(ui.aba==='semana')desenhaSemana();if(ui.aba==='datas')desenhaSim()},150)});

/* ---------- início ---------- */
(async()=>{
  try{
    /* se o navegador bloquear o armazenamento, o app abre mesmo assim */
    await Promise.race([abrirDB(),new Promise((_,no)=>setTimeout(()=>no(new Error('armazenamento indisponível')),4000))]);
    if(emNuvem()){await nuvemInicio();return}
    conta=await dbGet('conta')||null;authTela=conta?'entrar':'criar';
    render();return;
  }catch(e){console.warn(e)}
  rec();render();
  if(syncEstado==='auto')checar();
})();
window.__caixa={importar,estado:()=>({M,dados,cfg})};
</script>
</body>
